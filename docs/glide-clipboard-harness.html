<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glide Clipboard Harness</title>
  <meta name="description" content="Tabular Ontology Maker is a browser-based ontology builder with a spreadsheet interface for authoring, importing, and exporting ontology data." />
  <meta name="author" content="Jonathan Vajda" />
  <meta name="dcterms.creator" content="Jonathan Vajda" />
  <meta name="dcterms.rightsHolder" content="Jonathan Vajda" />
  <meta name="license" content="GNU General Public License version 3.0" />
  <link rel="license" href="https://www.gnu.org/licenses/gpl-3.0.en.html" />
  <meta name="dcterms.license" content="https://www.gnu.org/licenses/gpl-3.0.en.html" />
  <meta name="version" content="0.2.0" />
  <link rel="stylesheet" href="./styles/skeleton.css" />
  <link rel="stylesheet" href="./styles/glide-data-grid.min.css" />
  <link rel="stylesheet" href="./styles/ontology_spreadsheet_styles.css" />
</head>
<body style="margin: 1.5rem;">
  <h1>Clipboard Harness</h1>
  <p>Select a rectangle, copy it, then paste spreadsheet data from Excel, Sheets, or a TSV/CSV source.</p>
  <div id="ontology-grid" class="tom-grid-shell"></div>
  <div id="portal"></div>

  <script src="./app/glide-data-grid.min.js"></script>
  <script src="./app/tom-grid-glide.js"></script>
  <script>
    window.TOM.Grid.createGrid(document.getElementById("ontology-grid"), {
      colHeaders: ["iri", "label", "element type", "definition"],
      columns: [
        { type: "text" },
        { type: "text" },
        { type: "dropdown", source: ["Class", "NamedIndividual", "ObjectProperty"], strict: true },
        { type: "text", allowWrapping: true },
      ],
      data: [
        ["http://example.org/ont000010", "Car", "Class", "A road vehicle, typically with four wheels."],
        ["http://example.org/ont000011", "Plane", "Class", "A powered flying vehicle with fixed wings."],
        ["http://example.org/ont000012", "Boat", "Class", "A small vessel for traveling on water."],
        ["http://example.org/ont000013", "Alice", "NamedIndividual", "A sample named individual."],
      ],
    });
  </script>
</body>
</html>
