name: Deploy static content to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  LOOKUP_OUTPUT: docs/json/bfo-cco-lookup.json
  LOOKUP_SOURCE_DIR: src/ontologies
  LOOKUP_SOURCE_PATH: ""
  LOOKUP_SOURCE_URL: ""

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run Jest
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip rdflib

      - name: Regenerate lookup JSON when ontology sources are available
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/json
          generated_any=0

          if [ -d "${LOOKUP_SOURCE_DIR}" ]; then
            while IFS= read -r -d '' ontology_file; do
              filename="$(basename "${ontology_file}")"
              stem="${filename%.*}"
              output_path="docs/json/${stem}-lookup.json"
              echo "Generating ${output_path} from ${ontology_file}"
              python generate-lookup-json.py "${ontology_file}" -o "${output_path}"
              generated_any=1
            done < <(find "${LOOKUP_SOURCE_DIR}" -maxdepth 1 -type f \( -name '*.ttl' -o -name '*.rdf' -o -name '*.owl' -o -name '*.nt' -o -name '*.trig' -o -name '*.jsonld' \) -print0)
          fi

          if [ "${generated_any}" -eq 0 ]; then
            source_file=""
            temp_file=""

            if [ -n "${LOOKUP_SOURCE_URL}" ]; then
              temp_file="$(mktemp)"
              echo "Downloading lookup source from ${LOOKUP_SOURCE_URL}"
              curl -fsSL "${LOOKUP_SOURCE_URL}" -o "${temp_file}"
              source_file="${temp_file}"
            elif [ -n "${LOOKUP_SOURCE_PATH}" ] && [ -f "${LOOKUP_SOURCE_PATH}" ]; then
              source_file="${LOOKUP_SOURCE_PATH}"
            fi

            if [ -n "${source_file}" ]; then
              python generate-lookup-json.py "${source_file}" -o "${LOOKUP_OUTPUT}"
            else
              echo "No ontology source directory or single source configured; keeping committed lookup JSON files"
            fi

            if [ -n "${temp_file:-}" ] && [ -f "${temp_file}" ]; then
              rm -f "${temp_file}"
            fi
          fi

      - name: Write build info JSON
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > docs/build-info.json <<EOF
          {
            "ci": "github-actions",
            "commit": "${GITHUB_SHA}",
            "short_commit": "${GITHUB_SHA::7}",
            "built_at": "${built_at}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "ref": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
